<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Showko Yamanaka Illustration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<style>
  html, body { margin: 0; background: #000; }

  /* ステージ: 基準サイズ 1088 x --h(下の値) の「設計座標」を、画面幅いっぱいに拡大縮小して表示する。
     --x --y --w はすべてこの設計座標(px)での指定 */
  #stage {
    position: relative;
    width: 100%;
    --h: 9103;                       /* ページ全体の高さ(設計座標)。大きくすると下にスクロールできる範囲が増える */
    aspect-ratio: calc(1088 / var(--h));
    overflow: hidden;
    background: #000;
  }
  #stage { container-type: inline-size; }  /* 文字の大きさを、ステージの幅に合わせて拡大縮小するため */
  /* 最下部の水の上の「To be continued」。--y = 縦位置(設計座標)、--fs = 文字の大きさ(設計座標のpx) */
  #stage .ending {
    position: absolute; left: 0; width: 100%; text-align: center;
    top: calc(var(--y) / var(--h) * 100%);
    font-size: calc(var(--fs) / 1088 * 100cqw);
    letter-spacing: .3em; padding-left: .3em; /* padding-left は letter-spacing による右寄りを打ち消す */
    color: #fff; text-shadow: 0 0 .5em rgba(0, 70, 80, .55);
    pointer-events: none; user-select: none; margin: 0;
  }
  #stage .layer {
    position: absolute;
    left: calc(var(--x) / 1088 * 100%);
    top:  calc(var(--y) / var(--h) * 100%);
    width: calc(var(--w) / 1088 * 100%);
    height: auto;
    max-width: none;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
  }
  /* 鳥の目: 初めは隠れていて、条件を満たすとふわっと開く */
  #stage .eye { opacity: 0; transition: opacity .25s ease; }
  #stage .eye.open { opacity: 1; }
  /* 滝のしぶき: taki1 と taki2 を交互にパッと切り替える(滑らかに混ぜない) */
  #stage .foam1 { animation: foam1 0.7s steps(1, end) infinite; }  /* 0.7s = taki1 と taki2 が 1 往復する時間(各 0.35 秒表示) */
  #stage .foam2 { animation: foam2 0.7s steps(1, end) infinite; }  /* foam1 と同じ秒数にすること */
  @keyframes foam1 { 0% { opacity: 1; } 50% { opacity: 0; } }
  @keyframes foam2 { 0% { opacity: 0; } 50% { opacity: 1; } }
  /* 滝つぼの波紋: takitsubo1 → 2 → 3 → 2 を 1.2s で 1 周(各 0.3 秒)。1 つだけ表示される */
  #stage .tsubo { opacity: 0; }
  #stage .tsubo1 { animation: tsubo1 1.2s steps(1, end) infinite; }
  #stage .tsubo2 { animation: tsubo2 1.2s steps(1, end) infinite; }
  #stage .tsubo3 { animation: tsubo3 1.2s steps(1, end) infinite; }
  @keyframes tsubo1 { 0% { opacity: 1; } 25% { opacity: 0; } }
  @keyframes tsubo2 { 0% { opacity: 0; } 25% { opacity: 1; } 50% { opacity: 0; } 75% { opacity: 1; } }
  @keyframes tsubo3 { 0% { opacity: 0; } 50% { opacity: 1; } 75% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    #stage .foam1, #stage .foam2, #stage .tsubo { animation: none; }
    #stage .foam2, #stage .tsubo2, #stage .tsubo3 { opacity: 0; } #stage .tsubo1 { opacity: 1; }
  }
  /* 水を飲む鳥: 0度 → 4度 → 2度 → 2度 の順に(時計回り)傾いて、また 0度に戻る。6s = 1周の長さ(小さいほど速い)。
     角度は下の keyframes の度数、%は 1周の中での時刻 */
  #stage .bird-drink { animation: birdTilt 6s ease-in-out infinite; }
  @keyframes birdTilt { 0% { rotate: 0deg; } 25% { rotate: 4deg; } 50% { rotate: 2deg; } 75% { rotate: 2deg; } 100% { rotate: 0deg; } }
  @media (prefers-reduced-motion: reduce) { #stage .bird-drink { animation: none; } }
  /* 枝先の波紋(水を飲む鳥): a と b を 1.2s で交互に切り替える(a=0〜50%、b=50〜100%)。1.2s を小さくすると速くなる */
  #stage .tip-a { animation: tipA 1.2s steps(1, end) infinite; }
  #stage .tip-b { animation: tipB 1.2s steps(1, end) infinite; }
  @keyframes tipA { 0% { opacity: 1; } 50% { opacity: 0; } }
  @keyframes tipB { 0% { opacity: 0; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { #stage .tip-a, #stage .tip-b { animation: none; } #stage .tip-b { opacity: 0; } }
  /* kirakira: 全体がいっせいに、小さくぶるぶる震える(点滅はしない)。0.6s = 震えの 1 周の長さ(小さいほど速い)。
     translate の % は画像の幅(設計座標 1088px)に対する割合で、0.054% ≒ 0.6px。数字を大きくすると震えが大きくなる */
  #stage .kira-all { animation: kiraShake 0.6s steps(1, end) infinite, kiraShrink 1s ease-in-out infinite alternate; }  /* 震え + ほんの少し縮んで戻る(1s = 縮む→戻る の半周) */
  @keyframes kiraShake { 0% { translate: 0.043% -0.029%; } 14% { translate: -0.054% 0.036%; } 28% { translate: 0.029% 0.05%; } 42% { translate: -0.04% -0.043%; } 57% { translate: 0.058% 0.018%; } 71% { translate: -0.025% -0.054%; } 85% { translate: 0.036% 0.043%; } }
  @keyframes kiraShrink { from { scale: 1; } to { scale: 0.997; } }  /* 0.997 = 幅 1088px のとき約 3px 縮む。小さくするほど縮み方が大きい */
  @media (prefers-reduced-motion: reduce) { #stage .kira-all { animation: none; } }
  /* kirakira-top(滝より上): 全体がいっせいに、滑らかに消えて現れる。2s = 暗くなるまでの長さ(小さいほど速い)。.5 = 一番暗いときの明るさ */
  #stage .kira-top { animation: kiraFade 2s ease-in-out infinite alternate; }
  @keyframes kiraFade { from { opacity: 1; } to { opacity: .5; } }
  @media (prefers-reduced-motion: reduce) { #stage .kira-top { animation: none; } }
  /* 金色の枝: 揺れは下の JS(BRANCH_SWAY)で動かす。支点(枝の付け根)は各 <img> の transform-origin */
  #stage .branch { will-change: transform; }
  /* 葉 1 枚ぶんのスプライト(JS が生成) */
  #stage .leaf { position: absolute; will-change: transform; pointer-events: none; }
  #stage .dot  { position: absolute; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%;
                 background: #f33; border: 1px solid #000; pointer-events: none; z-index: 5; }
  #stage .dot.manual { background: #0f0; }
  #stage .dot.still  { background: #888; }
  #stage .sel  { position: absolute; border: 2px solid #ff0; pointer-events: none; z-index: 6; box-sizing: border-box; }
  #stage .hit  { position: absolute; inset: 0; z-index: 7; cursor: crosshair; }
</style>
</head>
<body>

<div id="stage">
  <!-- 奥から手前の順。位置(--x, --y)とサイズ(--w)は設計座標。data-sway の付いた葉は 1 枚ずつ揺れる -->
  <img class="layer" src="layers/acorns.webp"        style="--x:0; --y:1217; --w:1088" alt=""> <!-- どんぐり -->
  <img class="layer" src="layers/sky.webp"           style="--x:0; --y:0;    --w:1088" alt=""> <!-- 月と星(元画像1418pxを1088pxに縮小) -->
  <canvas class="layer" id="twinkle" width="1600" height="2256" style="--x:0; --y:0; --w:1088"></canvas> <!-- 星の小さな粒(sky-dots.webp を粒ごとに明滅させる) -->
  <img class="layer" src="layers/sora.webp" style="--x:0; --y:2396.3; --w:1088" alt=""> <!-- 日の出の空と月のもや(lake 座標 y=0 が --y:2396.3。以降の「湖の部品」はすべて 1600x6476 の同じ座標系から行を切り出したもの) -->
  <img class="layer" src="layers/mizu.webp" style="--x:0; --y:3708.7; --w:1088" alt=""> <!-- 水面 -->
  <canvas class="layer" id="shadow" width="1600" height="1340" style="--x:0; --y:3729.1; --w:1088"></canvas> <!-- 山の下の影(mizu.webp の y=1960〜3300 を、横の帯ごとに少しずらして描き直す。山 yama はこの上に重なる) -->
  <img class="layer" src="layers/mizu-lower.webp" style="--x:0; --y:6047; --w:1088" alt=""> <!-- 下の湖の水面(新しい絵。上端は mizu.webp と同じ模様でつながる。滝つぼの波紋 takitsubo はこの上に重なる。画像は 712px 幅) -->
  <img class="layer tsubo tsubo1" src="layers/takitsubo1.webp" style="--x:0; --y:5415.5; --w:1088" alt=""> <!-- 滝つぼの波紋 1→2→3→2 と繰り返す。岩(苔)の後ろに置く -->
  <img class="layer tsubo tsubo2" src="layers/takitsubo2.webp" style="--x:0; --y:5415.5; --w:1088" alt="">
  <img class="layer tsubo tsubo3" src="layers/takitsubo3.webp" style="--x:0; --y:5415.5; --w:1088" alt="">
  <img class="layer" src="layers/yama.webp" style="--x:0; --y:3402.7; --w:1088" alt=""> <!-- 山々 -->
  <canvas class="layer kira" id="kirakira3" data-src="layers/kirakira3.webp" width="1600" height="1110" style="--x:0; --y:3946.7; --w:1088"></canvas> <!-- 水面の光の筋。粒ごとにゆっくりランダムに点滅する -->
  <img class="layer kira-top" src="layers/kirakira-top.webp" style="--x:0; --y:4463.5; --w:1088" alt=""> <!-- きらきら(滝より上の光の筋)。全体がいっせいにフェードイン・フェードアウトで点滅する -->
  <img class="layer kira-all" src="layers/kirakira-fall.webp" style="--x:0; --y:4776.3; --w:1088" alt=""> <!-- きらきら(滝の上端の点線から滝のまわりまで)。全体がいっせいに小さく震えて、ほんの少し縮んでは戻る -->
  <canvas class="layer kira" id="kirakira2" data-src="layers/kirakira2.webp" width="1600" height="2390" style="--x:0; --y:3225.9; --w:1088"></canvas> <!-- きらきら(山・湖の小さな粒)。薄めに、細かく点滅 -->
  <canvas class="layer" id="fall" width="760" height="1100" style="--x:380.8; --y:4708.3; --w:516.8"></canvas> <!-- 滝の水の流れ(苔の岩 koke の後ろに置く)(lake 座標の (560,3400) から 760x1100px の範囲に重ねる) -->
  <img class="layer" src="layers/koke.webp" style="--x:0; --y:4558.7; --w:1088" alt=""> <!-- 苔の岩 -->
  <img class="layer" src="layers/tree.webp"          style="--x:0; --y:1217; --w:1088" alt="" data-role="tree"> <!-- 木 -->
  <img class="layer" src="layers/leaves.webp"        style="--x:0; --y:1217; --w:1088" alt="" data-sway> <!-- 葉(密) -->
  <img class="layer" src="layers/bird.webp"          style="--x:0; --y:1217; --w:1088" alt=""> <!-- 鳥 -->
  <img class="layer eye" id="bird-eye" src="layers/bird-eye.webp" style="--x:610; --y:2343; --w:42" alt=""> <!-- 鳥の開いた目(スクロールで現れる)。元の画像の (610,1126) から 42x38px を切り出したもの -->
  <img class="layer" src="layers/leaves-sparse.webp" style="--x:0; --y:1217; --w:1088" alt="" data-sway> <!-- 葉(まばら) -->
  <!-- ===== 下の絵: 水を飲む鳥(見本 tori_4.png の座標から、--y = 4906.6 + 見本のy × 0.68 で換算) ===== -->
  <img class="layer tip-a" src="layers/tip-ripple-a.webp" style="--x:494.4; --y:6731; --w:393" alt=""> <!-- 枝先の波紋(a と b が 1.2 秒ごとに切り替わる) -->
  <img class="layer tip-b" src="layers/mizu-lower-b.webp" style="--x:466.1; --y:6699.5; --w:460" alt=""> <!-- 波紋 b のときの水面の暗い筋(mizu-lower.webp の同じ位置に重ねて差し替える) -->
  <img class="layer tip-b" src="layers/tip-ripple-b.webp" style="--x:490.3; --y:6720.2; --w:401.2" alt="">
  <img class="layer" src="layers/branch-drink.webp" style="--x:0; --y:5846.4; --w:956.8" alt="" data-role="tree2"> <!-- 下の枝(葉 leaves-drink の揺れの基準にもなる) -->
  <img class="layer" src="layers/bird-feet.webp" style="--x:344.1; --y:6592.8; --w:193.8" alt=""> <!-- 鳥の足(枝の手前、鳥の体の後ろ) -->
  <img class="layer bird-drink" src="layers/bird-drink.webp" style="--x:42.8; --y:6102; --w:750.7; transform-origin:53% 97%" alt=""> <!-- 水を飲む鳥。transform-origin = 回転の中心(足もとあたり)。動きは CSS の .bird-drink -->
  <img class="layer" src="layers/leaves-drink.webp" style="--x:134.6; --y:5699.5; --w:806.5" alt="" data-sway data-tree="tree2" data-max-area="40000" data-max-gap="150"> <!-- 下の枝の葉(スクロールで揺れる) -->
  <img class="layer foam1" src="layers/taki1.webp" style="--x:0; --y:4912.3; --w:1088" alt=""> <!-- 滝のしぶき(taki1 と taki2 が交互に切り替わる) -->
  <img class="layer foam2" src="layers/taki2.webp" style="--x:0; --y:4912.3; --w:1088" alt="">
  <img class="layer branch" src="layers/ki2-left.webp" style="--x:-54.4; --y:4245.9; --w:598.4; transform-origin:9.09% 39.0%" alt=""> <!-- 金色の枝(ki2=上の枝、ki1=下の枝。左右に分けて、枝ごとにゆっくり揺れる。画像はページの端の外へ 80px 延長してある) -->
  <img class="layer branch" src="layers/ki2-right.webp" style="--x:544; --y:4245.9; --w:598.4; transform-origin:90.91% 57.5%" alt="">
  <img class="layer branch" src="layers/ki1-left.webp" style="--x:-54.4; --y:4517.9; --w:598.4; transform-origin:9.09% 46.9%" alt="">
  <img class="layer branch" src="layers/ki1-right.webp" style="--x:544; --y:4517.9; --w:598.4; transform-origin:90.91% 69.9%" alt="">
  <p class="ending" style="--y:8800; --fs:30">To be continued</p> <!-- 最下部の水の中央の文字 -->
</div>

<script>
// ===== 調整用パラメータ =====
const MIN_ANGLE    = 5;      // 揺れる角度の下限(度)
const MAX_ANGLE    = 8;      // 揺れる角度の上限(度)
const SWAY_SPEED   = 2;      // 揺れの速さ(大きいほど速い)
const SCROLL_BOOST = 0.45;   // スクロールで揺れ始める葉の割合(0〜1)
const SCROLL_GAIN  = 0.02;   // スクロール速度 -> 揺れやすさ
const DECAY        = 0.94;   // 収まる速さ(1 に近いほど長く揺れる)
const MAX_GAP      = 60;     // 枝からこれ以上離れた葉は揺らさない(木の画像のpx)
const MAX_AREA     = 12000;  // これより大きい塊(葉が重なって繋がったもの)は揺らさない(設計座標px²)
const MIN_AREA     = 150;    // これより小さい塊は揺らさない(設計座標px²)
const EYE_LINE     = 0.5;    // 鳥の目が、画面の上から この割合の位置より上に来たら目を開ける(2/3 = 画面の上から3分の2)
const DEBUG        = location.search.includes('debug'); // ?debug で支点を赤い点で表示
const EDIT         = location.search.includes('edit');  // ?edit で支点の編集モード
const PIVOT_FILE   = 'layer-pivots.json';
const STORE_KEY    = 'layerPivots';

// 手で指定した支点: [{ layer:'leaves.webp', leaf:[x,y], pivot:[x,y] }]
//   揺らさない葉:   [{ layer:'leaves.webp', leaf:[x,y], still:true }]
// 座標はすべて設計座標(幅1088、高さは --h)。leaf = その葉の上の任意の点 / pivot = 支点
let overrides = [];

const STAGE_W = 1088, STAGE_H = parseFloat(getComputedStyle(document.getElementById("stage")).getPropertyValue("--h"));
const stage = document.getElementById('stage');
const leaves = [];   // 揺らす葉 { el, h1, h2, h3, h4 }

function readPixels(img){
  const c = document.createElement('canvas');
  c.width = img.naturalWidth; c.height = img.naturalHeight;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.drawImage(img, 0, 0);
  return { c, g, w: c.width, h: c.height, id: g.getImageData(0, 0, c.width, c.height) };
}

// 木の「枝までの距離」マップ(チャンファー距離変換)。単位は木の画像の px(3倍値)
function distanceMap(px){
  const { w, h } = px, a = px.id.data, INF = 60000, d = new Uint16Array(w * h);
  for (let i = 0; i < w * h; i++) d[i] = a[i * 4 + 3] > 40 ? 0 : INF;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x; let v = d[i];
    if (x > 0) v = Math.min(v, d[i - 1] + 3);
    if (y > 0) { v = Math.min(v, d[i - w] + 3);
      if (x > 0) v = Math.min(v, d[i - w - 1] + 4);
      if (x < w - 1) v = Math.min(v, d[i - w + 1] + 4); }
    d[i] = v;
  }
  for (let y = h - 1; y >= 0; y--) for (let x = w - 1; x >= 0; x--) {
    const i = y * w + x; let v = d[i];
    if (x < w - 1) v = Math.min(v, d[i + 1] + 3);
    if (y < h - 1) { v = Math.min(v, d[i + w] + 3);
      if (x < w - 1) v = Math.min(v, d[i + w + 1] + 4);
      if (x > 0) v = Math.min(v, d[i + w - 1] + 4); }
    d[i] = v;
  }
  return { d, w, h };
}

// 葉の画像を 1 枚ずつに切り分け、付け根(=枝にいちばん近い部分)を支点にしたスプライトにする
// tree = { dist: 距離マップ, x, y, w } 基準にする枝の画像の位置(設計座標 --x --y --w)。葉と枝は同じ解像度(同じ倍率)の画像であること
function buildSway(img, tree){
  const dist = tree.dist;
  const px = readPixels(img), { w: W, h: H } = px, data = px.id.data;
  const imgW = parseFloat(img.style.getPropertyValue('--w')) || STAGE_W;
  const s = imgW / W;                             // 画像px -> 設計座標(最初の木と葉は --w:1088 なので 1088/W)
  const xOff = parseFloat(img.style.getPropertyValue('--x')) || 0;
  const yOff = parseFloat(img.style.getPropertyValue('--y'));
  // 葉の画像px -> 枝の画像px(位置のずれを足す。最初の木と葉は同じ位置なのでずれ 0)
  const sx = s / tree.s;                       // 葉と枝の倍率の比(同じなら 1)
  const offX = (xOff - tree.x) / tree.s, offY = (yOff - tree.y) / tree.s;
  const dAt = (x, y) => {
    const bx = Math.round(x * sx + offX), by = Math.round(y * sx + offY);
    if (bx < 0 || by < 0 || bx >= dist.w || by >= dist.h) return 1e4;   // 枝の画像の外は、遠いものとして扱う
    return dist.d[by * dist.w + bx] / 3;
  };

  // 1) 連結成分ラベリング(不透明度の高い部分を核にする)
  const label = new Int32Array(W * H), stack = new Int32Array(W * H);
  let n = 0;
  for (let i = 0; i < W * H; i++) {
    if (data[i * 4 + 3] < 64 || label[i]) continue;
    n++; let sp = 0; stack[sp++] = i; label[i] = n;
    while (sp) {
      const p = stack[--sp], x = p % W;
      if (x > 0     && !label[p-1] && data[(p-1)*4+3] >= 64) { label[p-1] = n; stack[sp++] = p-1; }
      if (x < W-1   && !label[p+1] && data[(p+1)*4+3] >= 64) { label[p+1] = n; stack[sp++] = p+1; }
      if (p >= W    && !label[p-W] && data[(p-W)*4+3] >= 64) { label[p-W] = n; stack[sp++] = p-W; }
      if (p < W*H-W && !label[p+W] && data[(p+W)*4+3] >= 64) { label[p+W] = n; stack[sp++] = p+W; }
    }
  }
  // 2) 縁の薄い画素(にじみ)を、隣の葉に割り当てる
  for (let pass = 0; pass < 3; pass++) {
    const prev = label.slice();
    for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
      const i = y * W + x;
      if (prev[i] || data[i * 4 + 3] === 0) continue;
      const v = prev[i-1] || prev[i+1] || prev[i-W] || prev[i+W];
      if (v) label[i] = v;
    }
  }
  // 画像ごとに揺らす条件を変えられる(data-max-area / data-max-gap。省略すると上の MAX_AREA / MAX_GAP)
  const maxArea = +img.dataset.maxArea || MAX_AREA, maxGap = +img.dataset.maxGap || MAX_GAP;
  // 3) 各塊の面積・範囲・枝までの最短距離
  const area = new Int32Array(n + 1), dmin = new Float32Array(n + 1).fill(1e9);
  const x0 = new Int32Array(n + 1).fill(W), y0 = new Int32Array(n + 1).fill(H), x1 = new Int32Array(n + 1), y1 = new Int32Array(n + 1);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, l = label[i]; if (!l) continue;
    if (x < x0[l]) x0[l] = x; if (x > x1[l]) x1[l] = x; if (y < y0[l]) y0[l] = y; if (y > y1[l]) y1[l] = y;
    if (data[i * 4 + 3] < 64) continue;
    area[l]++;
    const d = dAt(x, y);
    if (d < dmin[l]) dmin[l] = d;
  }
  // 4) 動かす葉を決め、支点 = 枝に近い画素の平均位置
  const move = new Uint8Array(n + 1), psx = new Float64Array(n + 1), psy = new Float64Array(n + 1), pn = new Int32Array(n + 1);
  let cnt = 0, tooBig = 0, tooFar = 0;
  for (let l = 1; l <= n; l++) {
    const a = area[l] * s * s;
    if (a > maxArea) tooBig++; else if (dmin[l] > maxGap) tooFar++;
    if (a >= MIN_AREA && a <= maxArea && dmin[l] <= maxGap) { move[l] = 1; cnt++; }
  }
  // 手で指定された支点を、該当する葉に紐づける(指定があれば対象外の葉も動かす)
  const layerName = img.src.split('/').pop();
  const ovPivot = new Array(n + 1).fill(null), still = new Uint8Array(n + 1);
  for (const o of overrides) {
    if (o.layer !== layerName) continue;
    const lx = Math.round((o.leaf[0] - xOff) / s), ly = Math.round((o.leaf[1] - yOff) / s);
    if (lx < 0 || ly < 0 || lx >= W || ly >= H) continue;
    const l = label[ly * W + lx];
    if (!l) continue;
    if (o.still) {
      // 揺らさない葉: 通常表示では動かさない画像のまま。編集モードでは選べるよう葉として作る
      still[l] = 1;
      if (EDIT && !move[l]) { move[l] = 1; cnt++; }
      if (!EDIT && move[l]) { move[l] = 0; cnt--; }
      continue;
    }
    ovPivot[l] = [(o.pivot[0] - xOff) / s, (o.pivot[1] - yOff) / s];
    if (!move[l]) { move[l] = 1; cnt++; }
  }
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, l = label[i];
    if (!l || !move[l] || data[i * 4 + 3] < 64) continue;
    if (dAt(x, y) <= dmin[l] + 2) { psx[l] += x; psy[l] += y; pn[l]++; }
  }
  // 5) スプライトを作り、元の画像からはその葉の画素を消す
  const sp = new Array(n + 1);
  for (let l = 1; l <= n; l++) if (move[l]) {
    const bw = x1[l] - x0[l] + 1, bh = y1[l] - y0[l] + 1;
    sp[l] = { buf: new Uint8ClampedArray(bw * bh * 4), bw, bh };
  }
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, l = label[i];
    if (!l || !move[l]) continue;
    const S = sp[l], j = ((y - y0[l]) * S.bw + (x - x0[l])) * 4;
    S.buf[j] = data[i*4]; S.buf[j+1] = data[i*4+1]; S.buf[j+2] = data[i*4+2]; S.buf[j+3] = data[i*4+3];
    data[i*4+3] = 0;
  }
  px.g.putImageData(px.id, 0, 0);

  // 残り(動かさない部分)は元の画像の代わりに canvas として表示
  px.c.className = 'layer';
  px.c.setAttribute('style', img.getAttribute('style'));
  img.replaceWith(px.c);
  let anchor = px.c;

  for (let l = 1; l <= n; l++) {
    if (!move[l]) continue;
    const S = sp[l], c = document.createElement('canvas');
    c.width = S.bw; c.height = S.bh;
    c.getContext('2d').putImageData(new ImageData(S.buf, S.bw, S.bh), 0, 0);
    c.className = 'leaf';
    const ppx = ovPivot[l] ? ovPivot[l][0] : pn[l] ? psx[l] / pn[l] : (x0[l] + x1[l]) / 2;
    const ppy = ovPivot[l] ? ovPivot[l][1] : pn[l] ? psy[l] / pn[l] : y1[l];
    Object.assign(c.style, {
      left:   ((xOff + x0[l] * s) / STAGE_W * 100) + '%',
      top:    ((yOff + y0[l] * s) / STAGE_H * 100) + '%',
      width:  (S.bw * s / STAGE_W * 100) + '%',
      height: (S.bh * s / STAGE_H * 100) + '%',
      transformOrigin: ((ppx - x0[l]) / S.bw * 100) + '% ' + ((ppy - y0[l]) / S.bh * 100) + '%',
    });
    anchor.after(c); anchor = c;
    // 葉ごとの乱数(同じ葉は毎回同じ値)
    const r = m => { const v = Math.sin((leaves.length + 1) * 12.9898 * m) * 43758.5453; return v - Math.floor(v); };
    const rec = { el: c, h1: r(1), h2: r(2.7), h3: r(5.1), h4: r(9.3), on: false,
                  layer: layerName, s, xOff, yOff, bx: x0[l], by: y0[l], bw: S.bw, bh: S.bh, manual: !!ovPivot[l], still: !!still[l], dot: null,
                  autoX: pn[l] ? psx[l] / pn[l] : (x0[l] + x1[l]) / 2, autoY: pn[l] ? psy[l] / pn[l] : y1[l] };   // 自動で求めた支点
    leaves.push(rec);
    if (DEBUG || EDIT) {
      const dot = document.createElement('div'); dot.className = 'dot';
      rec.dot = dot; placeDot(rec, ppx, ppy);
      anchor.after(dot); anchor = dot;
    }
  }
  console.log(`${img.src.split('/').pop()}: 塊 ${n}, 揺らす葉 ${cnt}, 大きすぎ ${tooBig}, 枝から遠い ${tooFar}`);
}

// 支点(レイヤー画像のpx)を、見た目の位置(点)と回転の中心(transform-origin)に反映する
function placeDot(L, px, py){
  L.px = px; L.py = py;
  L.el.style.transformOrigin = ((px - L.bx) / L.bw * 100) + '% ' + ((py - L.by) / L.bh * 100) + '%';
  if (L.dot) {
    L.dot.style.left = ((L.xOff + px * L.s) / STAGE_W * 100) + '%';
    L.dot.style.top  = ((L.yOff + py * L.s) / STAGE_H * 100) + '%';
    L.dot.classList.toggle('manual', L.manual && !L.still);
    L.dot.classList.toggle('still', !!L.still);
  }
}

// ===== 編集モード(?edit) =====
//  1回目のクリック: 直したい葉を選ぶ  2回目のクリック: 支点にしたい位置を指定
//  Esc: 選択取り消し / 選択中に右クリック: その葉の手指定を削除
function setupEditor(){
  const hit = document.createElement('div'); hit.className = 'hit'; stage.appendChild(hit);
  const sel = document.createElement('div'); sel.className = 'sel'; sel.style.display = 'none'; stage.appendChild(sel);

  const panel = document.createElement('div');
  Object.assign(panel.style, { position: 'fixed', top: '8px', right: '8px', width: '260px', padding: '10px',
    background: 'rgba(0,0,0,.75)', color: '#fff', font: '13px/1.5 sans-serif', borderRadius: '6px', zIndex: 10 });
  panel.innerHTML = `
    <div id="msg"></div>
    <div style="margin-top:6px">赤=自動 / 緑=手指定 / 灰=揺らさない</div>
    <button id="still">選んだ葉を揺らさない</button>
    <button id="copy">JSONをコピー</button>
    <button id="dl">${PIVOT_FILE}を保存</button>
    <button id="clr">手指定を全削除</button>
    <div id="cnt" style="margin-top:4px"></div>`;
  document.body.appendChild(panel);
  const msg = panel.querySelector('#msg'), cnt = panel.querySelector('#cnt');

  let cur = null;   // 選択中 { L, pt:[x,y] }
  const toDesign = e => { const r = stage.getBoundingClientRect();
    return [(e.clientX - r.left) / r.width * STAGE_W, (e.clientY - r.top) / r.height * STAGE_H]; };

  function leafAt(dx, dy){
    for (let i = leaves.length - 1; i >= 0; i--) {               // 手前の葉を優先
      const L = leaves[i], lx = Math.floor((dx - L.xOff) / L.s) - L.bx, ly = Math.floor((dy - L.yOff) / L.s) - L.by;
      for (let r = 0; r <= 3; r++) for (let oy = -r; oy <= r; oy++) for (let ox = -r; ox <= r; ox++) {
        const x = lx + ox, y = ly + oy;
        if (x < 0 || y < 0 || x >= L.bw || y >= L.bh) continue;
        if (L.el.getContext('2d').getImageData(x, y, 1, 1).data[3] > 30) return L;
      }
    }
    return null;
  }
  const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(overrides)); } catch (e) {} };
  const same = (o, L) => o.layer === L.layer && L.el.getContext('2d') &&
      (() => { const lx = Math.round((o.leaf[0] - L.xOff) / L.s) - L.bx, ly = Math.round((o.leaf[1] - L.yOff) / L.s) - L.by;
               return lx >= 0 && ly >= 0 && lx < L.bw && ly < L.bh && L.el.getContext('2d').getImageData(lx, ly, 1, 1).data[3] > 0; })();
  function text(){
    msg.textContent = cur ? '② 支点にしたい位置をクリック(Escで取消)' : '① 直したい葉をクリック';
    cnt.textContent = `手指定: ${overrides.length} 枚`;
    if (cur) {
      const L = cur.L; sel.style.display = '';
      sel.style.left = ((L.xOff + L.bx * L.s) / STAGE_W * 100) + '%';
      sel.style.top = ((L.yOff + L.by * L.s) / STAGE_H * 100) + '%';
      sel.style.width = (L.bw * L.s / STAGE_W * 100) + '%';
      sel.style.height = (L.bh * L.s / STAGE_H * 100) + '%';
    } else sel.style.display = 'none';
  }

  // 選んだ葉を「揺らさない」にする(ボタン または Delete キー)
  function setStill(){
    if (!cur) { msg.textContent = '先に、揺らさない葉をクリックして選んでください'; return; }
    const L = cur.L, o = { layer: L.layer, leaf: cur.pt, still: true };
    const k = overrides.findIndex(q => same(q, L));
    if (k >= 0) overrides[k] = o; else overrides.push(o);
    L.still = true; L.manual = false; L.el.style.transform = '';
    placeDot(L, L.px, L.py);
    cur = null; save(); text();
    msg.textContent = '揺らさない葉にしました';
  }
  panel.querySelector('#still').onclick = setStill;

  hit.addEventListener('click', e => {
    const [dx, dy] = toDesign(e);
    if (!cur) {
      const L = leafAt(dx, dy);
      if (!L) { msg.textContent = '動かせる葉が見つかりません。葉の上をクリック'; return; }
      cur = { L, pt: [Math.round(dx), Math.round(dy)] };
    } else {
      const L = cur.L, o = { layer: L.layer, leaf: cur.pt, pivot: [Math.round(dx * 10) / 10, Math.round(dy * 10) / 10] };
      const k = overrides.findIndex(q => same(q, L));
      if (k >= 0) overrides[k] = o; else overrides.push(o);
      L.manual = true; L.still = false;
      placeDot(L, (dx - L.xOff) / L.s, (dy - L.yOff) / L.s);
      cur = null; save();
    }
    text();
  });
  hit.addEventListener('contextmenu', e => {
    e.preventDefault(); if (!cur) return;
    const L = cur.L;
    overrides = overrides.filter(q => !same(q, L)); L.manual = false; L.still = false;
    placeDot(L, L.autoX, L.autoY);          // 自動で求めた支点に戻す(揺れる状態にも戻る)
    cur = null; save(); text();
    msg.textContent = '手指定を削除しました(自動の位置に戻しました)';
  });
  addEventListener('keydown', e => {
    if (e.key === 'Escape') { cur = null; text(); }
    if (e.key === 'Delete') setStill();
  });

  const json = () => JSON.stringify(overrides, null, 1);
  panel.querySelector('#copy').onclick = () => { navigator.clipboard.writeText(json()); msg.textContent = 'コピーしました'; };
  panel.querySelector('#dl').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([json()], { type: 'application/json' }));
    a.download = PIVOT_FILE; a.click();
  };
  panel.querySelector('#clr').onclick = () => { overrides = []; cur = null; save(); location.reload(); };
  text();
}

// ===== 揺らす(スクロールした時だけ) =====
const rad = Math.PI / 180;
let energy = 0, lastY = scrollY, moving = false;
const t0 = performance.now();

function frame(now){
  const y = scrollY, v = EDIT ? 0 : y - lastY; lastY = y;   // 編集中は揺らさない
  energy = Math.min(energy * DECAY + Math.abs(v) * SCROLL_GAIN, 1);
  if (energy > 0.002) {
    const t = (now - t0) / 1000;
    for (const L of leaves) {
      const env = L.still ? 0 : energy * (L.h4 < SCROLL_BOOST ? 0.9 : 0);
      if (env < 0.001) { if (L.on) { L.el.style.transform = ''; L.on = false; } continue; }
      const ang = (MIN_ANGLE + (MAX_ANGLE - MIN_ANGLE) * L.h3) * rad * env
                * Math.sin(t * SWAY_SPEED * (1.6 + L.h1 * 1.6) + L.h2 * 6.2831);
      L.el.style.transform = `rotate(${ang}rad)`; L.on = true;
    }
    moving = true;
  } else if (moving) {
    for (const L of leaves) { L.el.style.transform = ''; L.on = false; }
    moving = false;
  }
  requestAnimationFrame(frame);
}

// ===== 鳥の目: 画面の上から EYE_LINE の位置より上に来たら開く =====
function updateEye(){
  const eye = document.getElementById('bird-eye');
  const r = eye.getBoundingClientRect();
  const open = (r.top + r.height / 2) < innerHeight * EYE_LINE;
  eye.classList.toggle('open', open);
}
addEventListener('scroll', updateEye, { passive: true });
addEventListener('resize', updateEye);
updateEye();

(async () => {
  try {
  await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
  // 手指定の支点を読み込む(編集モードでは編集途中の内容を優先)
  try {
    const saved = EDIT && localStorage.getItem(STORE_KEY);
    overrides = saved ? JSON.parse(saved)
              : await fetch(PIVOT_FILE, { cache: 'no-cache' }).then(r => r.ok ? r.json() : []).catch(() => []);
  } catch (e) { overrides = []; }
  if (!Array.isArray(overrides)) overrides = [];

  // 葉ごとの基準の枝(data-tree="tree2" のように指定。省略すると最初の木 data-role="tree")。枝ごとに距離マップを 1 回だけ作る
  const trees = {};
  const treeOf = name => trees[name] || (() => {
    const el = document.querySelector('img[data-role="' + name + '"]');
    const w = parseFloat(el.style.getPropertyValue('--w'));
    const dm = distanceMap(readPixels(el));
    return trees[name] = { dist: dm, x: parseFloat(el.style.getPropertyValue('--x')) || 0, y: parseFloat(el.style.getPropertyValue('--y')), s: w / dm.w };
  })();
  for (const img of document.querySelectorAll('img[data-sway]')) buildSway(img, treeOf(img.dataset.tree || 'tree'));
  if (EDIT) setupEditor();
  } catch (e) { console.error('init failed:', e); }
  requestAnimationFrame(frame);
})();

<script>
// ===== 滝の水の流れ =====
// 滝の 3 段それぞれに、縦の筋を下へ流す。座標は canvas 内(lake.webp の (560,3400) を原点とした画像px)
const FALL_TIERS = [            // x0,x1,y0,y1 = 水が落ちる範囲 / speed = 落ちる速さ(px/秒) / n = 筋の本数
  { x0:170, x1:620, y0:185, y1:410, speed:150, n:46 },
  { x0:190, x1:590, y0:460, y1:665, speed:170, n:40 },
  { x0:120, x1:600, y0:855, y1:1010, speed:140, n:44 },
];
const FALL_ALPHA = 0.32;        // 筋の濃さ(0〜1)。大きいほどはっきり流れる
(function(){
  const cv = document.getElementById('fall'); if (!cv) return;
  const g = cv.getContext('2d');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  FALL_TIERS.forEach(t => {
    t.s = Array.from({ length: t.n }, () => ({
      x: t.x0 + rnd() * (t.x1 - t.x0), w: 2 + rnd() * 6, len: 40 + rnd() * 80,
      off: rnd() * 1000, v: 0.7 + rnd() * 0.6, dark: rnd() < 0.4 }));
  });
  let visible = false;
  new IntersectionObserver(e => { visible = e[0].isIntersecting; if (visible) requestAnimationFrame(draw); }).observe(cv);
  function draw(ts){
    if (!visible) return;
    g.clearRect(0, 0, cv.width, cv.height);
    const T = ts / 1000;
    for (const t of FALL_TIERS) {
      const H = t.y1 - t.y0;
      g.save(); g.beginPath(); g.rect(t.x0, t.y0, t.x1 - t.x0, H); g.clip();
      for (const s of t.s) {
        const span = H + s.len;
        const y = t.y0 - s.len + ((s.off + T * t.speed * s.v) % span);
        const a = FALL_ALPHA * (s.dark ? 0.8 : 1);
        const gr = g.createLinearGradient(0, y, 0, y + s.len);
        const c = s.dark ? '20,110,120' : '215,255,250';
        gr.addColorStop(0, 'rgba('+c+',0)'); gr.addColorStop(0.5, 'rgba('+c+','+a+')'); gr.addColorStop(1, 'rgba('+c+',0)');
        g.fillStyle = gr; g.fillRect(s.x, y, s.w, s.len);
      }
      g.restore();
    }
    requestAnimationFrame(draw);
  }
})();
</script>
<script>
// ===== 金色の枝のランダムな揺れ =====
// 周期の違う波を何本か足して、規則的に見えない揺れにする(スクロールとは無関係)
const BRANCH_SWAY = 2.3;       // 揺れる角度の目安(度)。大きいほど大きく揺れる
const BRANCH_SPEED = 1.6;       // 揺れの速さ(大きいほど速い)
(function(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const items = [...document.querySelectorAll('.branch')].map(el => ({
    el, waves: [0, 1, 2].map(() => ({ f: rnd(0.08, 0.3), p: rnd(0, 6.28), a: rnd(0.4, 1) }))
  }));
  let visible = false;
  const vis = new Set();
  const io = new IntersectionObserver(e => { e.forEach(x => x.isIntersecting ? vis.add(x.target) : vis.delete(x.target)); const v = vis.size > 0; if (v && !visible) { visible = true; requestAnimationFrame(tick); } visible = v; },
    { rootMargin: '200px' });
  items.forEach(it => io.observe(it.el));
  function tick(ts){
    if (!visible) return;
    const t = ts / 1000 * BRANCH_SPEED;
    for (const it of items) {
      let v = 0, sum = 0;
      for (const w of it.waves) { v += w.a * Math.sin(t * w.f * 6.283 + w.p); sum += w.a; }
      it.el.style.transform = 'rotate(' + (v / sum * BRANCH_SWAY).toFixed(3) + 'deg)';
    }
    requestAnimationFrame(tick);
  }
})();
</script>
<script>
// ===== 星の小さな粒の明滅 =====
// sky-dots.webp は、sky.webp から小さな粒だけを切り出した画像。TWINKLE_DOTS = 粒ごとの [x, y, 幅, 高さ](画像px)

<script>
// ===== 山の下の影の揺れ =====
// 水(mizu.webp)の山の下の部分(lake 座標 y=1960〜3300)を細い横帯に分け、帯ごとに左右へゆっくりずらして、影を揺らす
const SHADOW_AMP   = 14;        // 横に揺れる幅(画像px。1600px幅のとき)。大きいほど大きく揺れる
const SHADOW_SPEED = 1;         // 揺れの速さ(大きいほど速い)
const SHADOW_STRIP = 4;         // 帯の高さ(画像px)。小さいほど滑らかだが重い
(function(){
  const cv = document.getElementById('shadow'); if (!cv) return;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const g = cv.getContext('2d'), SRC_Y = 30, W = cv.width, H = cv.height;   // SRC_Y = mizu.webp の中での開始位置(mizu.webp は lake 座標 y=1930 から)
  const img = new Image(); img.src = 'layers/mizu.webp';
  let visible = false, ready = false, last = 0;
  img.onload = () => { ready = true; if (visible) requestAnimationFrame(tick); };
  new IntersectionObserver(e => { visible = e[0].isIntersecting; if (visible && ready) requestAnimationFrame(tick); }).observe(cv);
  function tick(ts){
    if (!visible || !ready) return;
    requestAnimationFrame(tick);
    if (ts - last < 33) return; last = ts;          // 約30fps
    const t = ts / 1000 * SHADOW_SPEED;
    g.clearRect(0, 0, W, H);
    for (let y = 0; y < H; y += SHADOW_STRIP) {
      const h = Math.min(SHADOW_STRIP, H - y);
      const fade = Math.min(1, y / 80, (H - y) / 80);  // 上端と下端では揺らさない(周りと繋がるように)
      const dx = SHADOW_AMP * fade * (Math.sin(y * 0.012 + t * 0.9) * 0.6 + Math.sin(y * 0.005 - t * 0.5 + 1.3) * 0.4);
      g.drawImage(img, 0, SRC_Y + y, W, h, dx, y, W, h);
    }
  }
})();
