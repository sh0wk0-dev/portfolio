<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | Showko Yamanaka Illustration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
</head>
<body>
<header class="menubar">
  <div class="title">Showko Yamanaka Illustration</div>
  <nav>
    <a href="profile.html">Profile</a>
    <a href="contact.html" aria-current="page">Contact</a>
    <a class="insta" href="https://www.instagram.com/showkoyamanaka/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.3" cy="6.7" r="1.1" fill="currentColor" stroke="none"/></svg>
    </a>
  </nav>
</header>

<main class="page">
  <h1>Contact</h1>
  <form class="form" id="contact-form" method="post" novalidate>
    <label>Name
      <input type="text" name="name" autocomplete="name" required>
    </label>
    <label>Company <span style="opacity:.6">(optional)</span>
      <input type="text" name="company" autocomplete="organization">
    </label>
    <label>Email
      <input type="email" name="email" autocomplete="email" required>
    </label>
    <label>Message
      <textarea name="message" required></textarea>
    </label>
    <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button type="submit">Send</button>
    <p class="note" id="form-note" role="status" aria-live="polite"></p>
  </form>
</main>

<script>
// ===== 送信先の設定 =====
// 通常は、Send を押すと、入力内容が入ったメールを MAIL_TO 宛てに作成して、お使いのメールソフトで開く(mailto 方式)。
// フォーム受信サービス(例: Formspree の https://formspree.io/f/xxxxxxxx)を使う場合は FORM_ENDPOINT に URL を入れると、
// メールソフトを開かず、ページ上でそのまま送信される。
const MAIL_TO = 'showko_sub_email@yahoo.co.jp';
const FORM_ENDPOINT = '';

const form = document.getElementById('contact-form');
const note = document.getElementById('form-note');
form.addEventListener('submit', async e => {
  e.preventDefault();
  note.textContent = '';
  const data = new FormData(form);
  if (data.get('website')) return;                                  // 隠し欄が埋まっていたら送らない
  const name = (data.get('name') || '').trim(), email = (data.get('email') || '').trim(), message = (data.get('message') || '').trim(), company = (data.get('company') || '').trim();
  if (!name || !message || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
    note.textContent = 'Please fill in all fields with a valid email address.';
    return;
  }
  if (!FORM_ENDPOINT) {                                              // mailto 方式: メールソフトを開く
    const subject = 'Contact from ' + name;
    const body = message + '\n\n---\nName: ' + name + '\nEmail: ' + email + (company ? '\nCompany: ' + company : '');
    location.href = 'mailto:' + MAIL_TO + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
    note.textContent = 'Your email app should open with the message ready. Please press send there to finish.';
    return;
  }
  const btn = form.querySelector('button'); btn.disabled = true;
  try {
    const res = await fetch(FORM_ENDPOINT, { method: 'POST', headers: { Accept: 'application/json' }, body: data });
    if (!res.ok) throw new Error(res.status);
    form.reset(); note.textContent = 'Thank you. Your message has been sent.';
  } catch (err) {
    note.textContent = 'Sorry, the message could not be sent. Please try again later.';
  } finally { btn.disabled = false; }
});
</script>
</body>
</html>
